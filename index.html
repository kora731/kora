<script>

function sendToTelegram(message) {

    fetch("/api/send", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })

    })
    .then(response => response.json())

    .then(data => {

        console.log("Telegram:", data);

        if (!data.success) {

            console.error(
                "Telegram error:",
                data
            );

        }

    })

    .catch(error => {

        console.error(
            "Server error:",
            error
        );

    });

}

</script>
